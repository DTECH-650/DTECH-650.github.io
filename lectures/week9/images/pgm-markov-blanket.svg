<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">The Markov blanket of X</title>
  <desc id="desc">The target X has parent P, children C1 and C2, and co-parent Q at child C1. These four blue nodes are its Markov blanket. U points to P and C2 points to V, placing U and V outside the blanket.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="540" rx="12" fill="#ffffff"/>
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M 100 118 L 187 118"/>
    <path d="M 246 139 L 373 216"/>
    <path d="M 431 244 L 615 285"/>
    <path d="M 689 151 L 656 259"/>
    <path d="M 400 265 L 400 360"/>
    <path d="M 434 394 L 614 394"/>
  </g>
  <g stroke-width="2.5">
    <g fill="#f1f5f9" stroke="#64748b">
      <circle cx="66" cy="118" r="34"/>
      <circle cx="650" cy="394" r="34"/>
    </g>
    <g fill="#dbeafe" stroke="#2563eb">
      <circle cx="220" cy="118" r="34"/>
      <circle cx="700" cy="118" r="34"/>
      <circle cx="650" cy="292" r="34"/>
      <circle cx="400" cy="394" r="34"/>
    </g>
    <circle cx="400" cy="231" r="34" fill="#fef3c7" stroke="#d97706"/>
  </g>
  <g fill="#0f172a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="400" y="39" font-size="23" font-weight="600">Markov blanket of X</text>
    <g font-size="25" font-weight="600">
      <text x="66" y="127">U</text><text x="220" y="127">P</text><text x="400" y="240">X</text><text x="700" y="127">Q</text>
      <text x="650" y="301">C₁</text><text x="400" y="403">C₂</text><text x="650" y="403">V</text>
    </g>
    <g font-size="17" fill="#475569">
      <text x="66" y="175">Outside</text>
      <text x="220" y="72">Parent</text>
      <text x="700" y="72">Co-parent</text>
      <text x="650" y="349">Child</text>
      <text x="400" y="451">Child</text>
      <text x="650" y="451">Outside</text>
    </g>
    <text x="400" y="493" font-size="20">MB(X) = {P, Q, C₁, C₂}</text>
    <text x="400" y="526" font-size="17" fill="#475569">Amber = target · Blue = blanket · Gray = outside</text>
  </g>
</svg>
