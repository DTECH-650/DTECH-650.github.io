<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">An unobserved chain and a chain blocked by observation</title>
  <desc id="desc">Left: X points to Z, which points to Y; nothing is observed and the path is active. Right: the same chain with Z observed, blocking the path.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="12" fill="#ffffff"/>
  <line x1="450" y1="28" x2="450" y2="248" stroke="#e2e8f0" stroke-width="2"/>
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M 122 142 L 197 142"/>
    <path d="M 262 142 L 337 142"/>
    <path d="M 562 142 L 637 142"/>
    <path d="M 702 142 L 777 142"/>
  </g>
  <g fill="#f8fafc" stroke="#334155" stroke-width="2.5">
    <circle cx="90" cy="142" r="32"/>
    <circle cx="230" cy="142" r="32"/>
    <circle cx="370" cy="142" r="32"/>
    <circle cx="530" cy="142" r="32"/>
    <circle cx="670" cy="142" r="32" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="810" cy="142" r="32"/>
  </g>
  <g fill="#0f172a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g font-size="22" font-weight="600">
      <text x="230" y="53">Z is unobserved</text>
      <text x="670" y="53">Z is observed</text>
    </g>
    <g font-size="25" font-weight="600">
      <text x="90" y="151">X</text><text x="230" y="151">Z</text><text x="370" y="151">Y</text>
      <text x="530" y="151">X</text><text x="670" y="151">Z</text><text x="810" y="151">Y</text>
    </g>
    <text x="230" y="220" font-size="20" fill="#475569">Active path: dependence is possible</text>
    <text x="670" y="220" font-size="20" fill="#475569">Blocked path: X ⟂ Y | Z</text>
    <text x="450" y="282" font-size="17" fill="#475569">Blue fill = observed / conditioned on</text>
  </g>
</svg>
