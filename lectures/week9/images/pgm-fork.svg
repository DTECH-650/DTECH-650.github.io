<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">A shared-parent fork before and after observing the parent</title>
  <desc id="desc">Two copies of Z pointing to X and Y. The left has an unobserved Z and an active path. The right has observed Z and a blocked path.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="360" rx="12" fill="#ffffff"/>
  <line x1="450" y1="25" x2="450" y2="310" stroke="#e2e8f0" stroke-width="2"/>
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M 205 135 L 125 209"/>
    <path d="M 255 135 L 335 209"/>
    <path d="M 645 135 L 565 209"/>
    <path d="M 695 135 L 775 209"/>
  </g>
  <g fill="#f8fafc" stroke="#334155" stroke-width="2.5">
    <circle cx="230" cy="112" r="32"/>
    <circle cx="100" cy="232" r="32"/>
    <circle cx="360" cy="232" r="32"/>
    <circle cx="670" cy="112" r="32" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="540" cy="232" r="32"/>
    <circle cx="800" cy="232" r="32"/>
  </g>
  <g fill="#0f172a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g font-size="22" font-weight="600">
      <text x="230" y="46">Z is unobserved</text>
      <text x="670" y="46">Z is observed</text>
    </g>
    <g font-size="25" font-weight="600">
      <text x="230" y="121">Z</text><text x="100" y="241">X</text><text x="360" y="241">Y</text>
      <text x="670" y="121">Z</text><text x="540" y="241">X</text><text x="800" y="241">Y</text>
    </g>
    <text x="230" y="303" font-size="20" fill="#475569">Active path: dependence is possible</text>
    <text x="670" y="303" font-size="20" fill="#475569">Blocked path: X ⟂ Y | Z</text>
    <text x="450" y="344" font-size="17" fill="#475569">Blue fill = observed / conditioned on</text>
  </g>
</svg>
