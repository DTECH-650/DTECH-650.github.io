<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Two-sided 95 percent interval under the standard normal curve</title>
  <desc id="figure-description">The area between z equals negative 1.96 and positive 1.96 is 95 percent. Each outside tail has 2.5 percent. The area to the left of positive 1.96 is therefore 97.5 percent.</desc>

  <rect x="1" y="1" width="798" height="418" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033">A two-sided 95% interval on the standard normal curve</text>
  <text x="400" y="65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">The shaded area represents probability, not the height of the curve.</text>

  <!-- The boundaries at x=235 and x=565 correspond to z=-1.96 and z=+1.96. -->
  <path d="M 105 306 L 105 305 C 160 304 210 293 235 275 L 235 306 Z" fill="#fed7aa"/>
  <path d="M 235 306 L 235 275 C 270 245 305 188 340 143 C 365 111 382 96 400 96 C 418 96 435 111 460 143 C 495 188 530 245 565 275 L 565 306 Z" fill="#bfdbfe"/>
  <path d="M 565 306 L 565 275 C 590 293 640 304 695 305 L 695 306 Z" fill="#fed7aa"/>

  <line x1="235" y1="103" x2="235" y2="306" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="565" y1="103" x2="565" y2="306" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M 105 305 C 160 304 210 293 235 275 C 270 245 305 188 340 143 C 365 111 382 96 400 96 C 418 96 435 111 460 143 C 495 188 530 245 565 275 C 590 293 640 304 695 305" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="306" x2="720" y2="306" stroke="#334155" stroke-width="2"/>

  <text x="400" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">95% in the center</text>
  <text x="116" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#9a3412">2.5%</text>
  <text x="116" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9a3412">left tail</text>
  <line x1="145" y1="236" x2="176" y2="289" stroke="#9a3412" stroke-width="2"/>
  <text x="684" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#9a3412">2.5%</text>
  <text x="684" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9a3412">right tail</text>
  <line x1="655" y1="236" x2="624" y2="289" stroke="#9a3412" stroke-width="2"/>

  <line x1="235" y1="306" x2="235" y2="314" stroke="#334155" stroke-width="2"/>
  <line x1="400" y1="306" x2="400" y2="314" stroke="#334155" stroke-width="2"/>
  <line x1="565" y1="306" x2="565" y2="314" stroke="#334155" stroke-width="2"/>
  <text x="235" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172033">−1.96</text>
  <text x="400" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172033">0</text>
  <text x="565" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172033">+1.96</text>
  <text x="725" y="313" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="italic" fill="#334155">z</text>

  <rect x="160" y="365" width="480" height="38" rx="8" fill="#eff6ff"/>
  <text x="400" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Area left of +1.96 = 2.5% + 95% = 97.5%</text>
</svg>
