<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="title description">
  <title id="title">Z-scores, erf, and erfc on the standard Gaussian curve</title>
  <desc id="description">Top: a z-score of positive one divides the standard Gaussian curve into 84.13 percent to its left and 15.87 percent in its right tail. Bottom: the interval from z equals negative one to positive one contains 68.27 percent, given by erf of one over square root of two; the two outside tails together contain 31.73 percent, given by erfc of one over square root of two.</desc>
  <rect x="1" y="1" width="898" height="578" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033">A z-score locates a threshold; erf and erfc measure areas</text>
  <text x="450" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Standard Gaussian Z = (X − μ) / σ; shaded area under the curve is probability.</text>
  <text x="90" y="96" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#172033">One threshold: z = +1</text>
