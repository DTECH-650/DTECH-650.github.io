<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Observed targets, least-squares predictions, and residuals</title>
  <desc id="desc">Three observed data points are x zero y one, x one y two, and x two y two. The fitted line predicts seven sixths, five thirds, and thirteen sixths at these inputs. Dashed vertical segments connect each fitted prediction to its observed target, giving residuals minus one sixth, plus one third, and minus one sixth.</desc>
  <rect width="1000" height="540" rx="14" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="42" font-size="26" font-weight="700" fill="#0f172a">What least squares fits</text>
    <text x="90" y="72" font-size="16" fill="#475569">Three observations and the fitted line: predicted value = 7/6 + x/2</text>
    <g font-size="15" fill="#334155">
      <circle cx="105" cy="101" r="6" fill="#111827"/>
      <text x="121" y="106">observed target (ground truth for this observation)</text>
      <line x1="514" y1="101" x2="546" y2="101" stroke="#2563eb" stroke-width="3"/>
      <rect x="526" y="95" width="12" height="12" rx="2" fill="#2563eb" stroke="#ffffff" stroke-width="1"/>
      <text x="553" y="106">fitted prediction</text>
      <line x1="730" y1="101" x2="762" y2="101" stroke="#ea580c" stroke-width="3" stroke-dasharray="6 5"/>
      <text x="769" y="106">residual</text>
    </g>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="120" y1="400" x2="900" y2="400"/>
      <line x1="120" y1="280" x2="900" y2="280"/>
      <line x1="120" y1="160" x2="900" y2="160"/>
      <line x1="200" y1="130" x2="200" y2="460"/>
      <line x1="500" y1="130" x2="500" y2="460"/>
      <line x1="800" y1="130" x2="800" y2="460"/>
    </g>
    <g stroke="#334155" stroke-width="2">
      <line x1="120" y1="130" x2="120" y2="460"/>
      <line x1="120" y1="460" x2="900" y2="460"/>
    </g>
    <g font-size="16" fill="#475569">
      <text x="107" y="405" text-anchor="end">1.0</text>
      <text x="107" y="285" text-anchor="end">1.5</text>
      <text x="107" y="165" text-anchor="end">2.0</text>
      <text x="200" y="486" text-anchor="middle">0</text>
      <text x="500" y="486" text-anchor="middle">1</text>
      <text x="800" y="486" text-anchor="middle">2</text>
      <text x="920" y="466">x</text>
      <text x="100" y="143">y</text>
    </g>
    <line x1="200" y1="360" x2="800" y2="120" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
    <g stroke="#ea580c" stroke-width="3" stroke-dasharray="7 5">
      <line x1="200" y1="360" x2="200" y2="400"/>
      <line x1="500" y1="240" x2="500" y2="160"/>
      <line x1="800" y1="120" x2="800" y2="160"/>
    </g>
    <g fill="#2563eb" stroke="#ffffff" stroke-width="2">
      <rect x="193" y="353" width="14" height="14" rx="2"/>
      <rect x="493" y="233" width="14" height="14" rx="2"/>
      <rect x="793" y="113" width="14" height="14" rx="2"/>
    </g>
    <g fill="#111827" stroke="#ffffff" stroke-width="2">
      <circle cx="200" cy="400" r="8"/>
      <circle cx="500" cy="160" r="8"/>
      <circle cx="800" cy="160" r="8"/>
    </g>
    <g font-size="16" font-weight="600">
      <text x="220" y="386" fill="#c2410c">r₁ = −1/6</text>
      <text x="522" y="207" fill="#c2410c">r₂ = +1/3</text>
      <text x="820" y="145" fill="#c2410c">r₃ = −1/6</text>
    </g>
    <text x="500" y="521" font-size="16" text-anchor="middle" fill="#475569">A residual is the vertical distance from a fitted prediction to its observed target, with a sign.</text>
  </g>
</svg>
