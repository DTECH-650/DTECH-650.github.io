<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535" role="img" aria-labelledby="title desc">
  <title id="title">Gradient descent steps with two learning rates</title>
  <desc id="desc">Both panels show the quadratic loss J of w equals one half times w minus three squared, with a minimum at w equals three. In the left panel, learning rate one half moves the weights from zero to 1.5, 2.25, then 2.625, approaching the minimum. In the right panel, learning rate two jumps between zero and six, leaving the loss unchanged.</desc>
  <defs>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#0f766e"/></marker>
    <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#be123c"/></marker>
  </defs>
  <rect width="1000" height="535" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="50" y="43" font-size="26" font-weight="700" fill="#0f172a">The learning rate changes the path through the loss</text>
  <rect x="50" y="68" width="430" height="410" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="72" y="101" font-size="21" font-weight="700" fill="#0f172a">A. A useful step size</text>
  <text x="72" y="127" font-size="16" fill="#475569">Learning rate α = 0.5</text>
