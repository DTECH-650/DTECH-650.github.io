  <line x1="900" y1="160" x2="900" y2="320" stroke="#f1f5f9"/>
  <line x1="900" y1="450" x2="900" y2="650" stroke="#f1f5f9"/>
  <text x="900" y="344" text-anchor="middle">40</text>
  <text x="900" y="676" text-anchor="middle">40</text>
    <line x1="100" y1="320" x2="900" y2="320" stroke="#475569" stroke-width="2"/>
    <line x1="100" y1="160" x2="100" y2="320" stroke="#475569" stroke-width="2"/>
    <text x="500" y="367" text-anchor="middle">Temperature (°C)</text>
    <text x="100" y="402" fill="#0f172a" font-size="19" font-weight="700">B. Fit the weights to the observations</text>
    <line x1="115" y1="425" x2="149" y2="425" stroke="#1d4ed8" stroke-width="4"/>
    <text x="159" y="430">weighted sum (predicted mean)</text>
    <circle cx="510" cy="425" r="5" fill="#111827"/>
    <text x="523" y="430">observed electricity use</text>
    <line x1="100" y1="650" x2="900" y2="650" stroke="#475569" stroke-width="2"/>
    <line x1="100" y1="450" x2="100" y2="650" stroke="#475569" stroke-width="2"/>
    <text x="500" y="699" text-anchor="middle">Temperature (°C)</text>
    <text x="100" y="731" fill="#64748b" font-size="15">The centers and widths stay fixed; the fitted weights change the combined curve.</text>
  </g>
