  <text x="83" y="240" text-anchor="end">0.5</text>
  <line x1="100" y1="310" x2="900" y2="310" stroke="#e2e8f0"/>
  <text x="83" y="315" text-anchor="end">0</text>
  <line x1="100" y1="450" x2="900" y2="450" stroke="#e2e8f0"/>
  <text x="83" y="455" text-anchor="end">70</text>
  <line x1="100" y1="490" x2="900" y2="490" stroke="#e2e8f0"/>
  <text x="83" y="495" text-anchor="end">60</text>
  <line x1="100" y1="570" x2="900" y2="570" stroke="#e2e8f0"/>
  <text x="83" y="575" text-anchor="end">40</text>
  <line x1="100" y1="650" x2="900" y2="650" stroke="#e2e8f0"/>
  <text x="83" y="655" text-anchor="end">20</text>
  <line x1="100" y1="160" x2="100" y2="320" stroke="#f1f5f9"/>
  <line x1="100" y1="450" x2="100" y2="650" stroke="#f1f5f9"/>
  <text x="100" y="344" text-anchor="middle">0</text>
  <text x="100" y="676" text-anchor="middle">0</text>
  <line x1="300" y1="160" x2="300" y2="320" stroke="#f1f5f9"/>
  <line x1="300" y1="450" x2="300" y2="650" stroke="#f1f5f9"/>
  <text x="300" y="344" text-anchor="middle">10</text>
  <text x="300" y="676" text-anchor="middle">10</text>
  <line x1="500" y1="160" x2="500" y2="320" stroke="#f1f5f9"/>
  <line x1="500" y1="450" x2="500" y2="650" stroke="#f1f5f9"/>
  <text x="500" y="344" text-anchor="middle">20</text>
  <text x="500" y="676" text-anchor="middle">20</text>
  <line x1="700" y1="160" x2="700" y2="320" stroke="#f1f5f9"/>
