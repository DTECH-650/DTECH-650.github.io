<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" role="img" aria-labelledby="title desc">
  <title id="title">Fixed Gaussian basis functions and their fitted weighted sum</title>
  <desc id="desc">Top: five colored Gaussian-shaped basis functions, centered at 0, 10, 20, 30, and 40 degrees Celsius, each with fixed width 5 degrees. Bottom: sample electricity observations as black dots and a smooth blue curve fitted by changing the weights of those fixed functions.</desc>
  <rect width="1000" height="750" rx="14" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#334155" font-size="16">
    <text x="100" y="42" fill="#0f172a" font-size="25" font-weight="700">From basis functions to a fitted mean</text>
    <text x="100" y="83" fill="#0f172a" font-size="19" font-weight="700">A. Fixed input transformations</text>
    <text x="100" y="106">Each bell is largest near its center; all have width s = 5°C.</text>
  <line x1="115" y1="125" x2="139" y2="125" stroke="#2563eb" stroke-width="4"/><text x="147" y="130">center 0°C</text>
  <line x1="269" y1="125" x2="293" y2="125" stroke="#0f766e" stroke-width="4"/><text x="301" y="130">center 10°C</text>
  <line x1="423" y1="125" x2="447" y2="125" stroke="#7c3aed" stroke-width="4"/><text x="455" y="130">center 20°C</text>
  <line x1="577" y1="125" x2="601" y2="125" stroke="#ea580c" stroke-width="4"/><text x="609" y="130">center 30°C</text>
  <line x1="731" y1="125" x2="755" y2="125" stroke="#be123c" stroke-width="4"/><text x="763" y="130">center 40°C</text>
  <line x1="100" y1="160" x2="900" y2="160" stroke="#e2e8f0"/>
  <text x="83" y="165" text-anchor="end">1</text>
