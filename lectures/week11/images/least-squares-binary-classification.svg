<svg xmlns="http://www.w3.org/2000/svg" width="820" height="490" viewBox="0 0 820 490" role="img" aria-labelledby="title description">
  <title id="title">Least-squares fit to binary class codes</title>
  <desc id="description">A line r of x equals x passes through training labels zero and one. Thresholding the line at zero point five gives a class boundary at x equals zero point five. The predicted value two at x equals two is outside the valid probability range.</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="820" height="490" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">Fit coded labels, then choose a class</text>

  <rect x="131" y="210" width="439" height="149" fill="#ecfdf5"/>
  <text x="592" y="225" font-family="sans-serif" font-size="15" font-weight="600" fill="#047857">Valid probability range</text>
  <text x="592" y="248" font-family="sans-serif" font-size="15" fill="#047857">0 to 1</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <path d="M 130 210 H 570 M 130 285 H 570 M 330 60 V 360 M 530 60 V 360"/>
  </g>
  <path d="M 130 360 H 575 M 130 390 V 46" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <text x="578" y="368" font-family="sans-serif" font-size="18" font-weight="600" fill="#334155">x</text>
  <text x="110" y="49" font-family="sans-serif" font-size="18" font-weight="600" fill="#334155">r(x)</text>
  <g font-family="sans-serif" font-size="15" fill="#475569">
    <text x="124" y="384">0</text>
    <text x="324" y="384">1</text>
    <text x="524" y="384">2</text>
    <text x="103" y="365">0</text>
    <text x="88" y="290">0.5</text>
    <text x="103" y="215">1</text>
    <text x="103" y="65">2</text>
  </g>

  <path d="M 130 285 H 570" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="591" y="290" font-family="sans-serif" font-size="15" font-weight="600" fill="#6d28d9">Decision threshold</text>
  <text x="591" y="312" font-family="sans-serif" font-size="15" fill="#6d28d9">r(x) = 0.5</text>
  <path d="M 230 285 V 360" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M 130 360 L 530 60" fill="none" stroke="#c2410c" stroke-width="4"/>
  <text x="392" y="146" font-family="sans-serif" font-size="18" font-weight="700" fill="#9a3412">r(x) = x</text>

  <circle cx="130" cy="360" r="9" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
  <text x="149" y="324" font-family="sans-serif" font-size="15" fill="#1e40af">training label 0</text>
  <circle cx="330" cy="210" r="9" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
  <text x="344" y="226" font-family="sans-serif" font-size="15" fill="#1e40af">training label 1</text>
  <circle cx="530" cy="60" r="10" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
  <text x="548" y="77" font-family="sans-serif" font-size="15" font-weight="600" fill="#b91c1c">r(2) = 2</text>
  <text x="548" y="99" font-family="sans-serif" font-size="15" fill="#b91c1c">not a probability</text>

  <text x="163" y="429" font-family="sans-serif" font-size="17" font-weight="600" fill="#1e40af">Class C₂</text>
  <text x="376" y="429" font-family="sans-serif" font-size="17" font-weight="600" fill="#9a3412">Class C₁</text>
  <text x="229" y="458" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#6d28d9">boundary at x = 0.5</text>
</svg>
