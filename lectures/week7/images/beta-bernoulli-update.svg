<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
  <title id="title">Beta–Bernoulli prior and posterior</title>
  <desc id="desc">The Beta(2,2) prior density is symmetric around theta one half. After three successes and one failure, the Beta(5,3) posterior density is taller and shifted toward larger theta.</desc>
  <rect width="760" height="410" rx="14" fill="#ffffff"/>
  <text x="80" y="40" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Learning a Bernoulli success probability</text>
  <text x="80" y="65" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16">Prior + 3 successes and 1 failure → posterior</text>
  <g stroke="#e2e8f0" stroke-width="1.5">
    <line x1="80" y1="125" x2="690" y2="125"/>
    <line x1="80" y1="220" x2="690" y2="220"/>
    <line x1="80" y1="315" x2="690" y2="315"/>
  </g>
  <g fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end">
    <text x="70" y="320">0</text><text x="70" y="225">1</text><text x="70" y="130">2</text>
  </g>
  <line x1="80" y1="90" x2="80" y2="315" stroke="#64748b" stroke-width="2"/>
  <line x1="80" y1="315" x2="690" y2="315" stroke="#64748b" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="2">
    <line x1="80" y1="315" x2="80" y2="322"/><line x1="232.5" y1="315" x2="232.5" y2="322"/>
    <line x1="385" y1="315" x2="385" y2="322"/><line x1="537.5" y1="315" x2="537.5" y2="322"/>
    <line x1="690" y1="315" x2="690" y2="322"/>
  </g>
  <g fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">
    <text x="80" y="344">0</text><text x="232.5" y="344">0.25</text><text x="385" y="344">0.5</text>
    <text x="537.5" y="344">0.75</text><text x="690" y="344">1</text>
  </g>
  <text x="385" y="380" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">Success probability θ</text>
  <text x="25" y="210" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" transform="rotate(-90 25 210)">Density</text>
