<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title description">
  <title id="title">Squared error and classification accuracy compare models differently</title>
  <desc id="description">Two side-by-side plots fit the same three binary labels. Candidate A, r equals x, has sum of squared errors one. Candidate B, r equals zero point two plus zero point four x, has sum of squared errors zero point two. Both classify all three training points correctly using a threshold of zero point five.</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="31" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#0f172a">Same class decisions, different squared errors</text>

  <rect x="60" y="50" width="370" height="362" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="470" y="50" width="370" height="362" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="245" y="78" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f172a">A: r(x) = x</text>
  <text x="655" y="78" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f172a">B: r(x) = 0.2 + 0.4x</text>
  <text x="245" y="102" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">3/3 correct; squared-error sum = 1</text>
  <text x="655" y="102" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">3/3 correct; squared-error sum = 0.20</text>

  <path d="M 155 350 H 386" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <path d="M 155 364 V 125" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <path d="M 545 350 H 776" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <path d="M 545 364 V 125" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <g font-family="sans-serif" font-size="14" fill="#475569">
    <text x="151" y="375">0</text><text x="251" y="375">1</text><text x="351" y="375">2</text>
    <text x="541" y="375">0</text><text x="641" y="375">1</text><text x="741" y="375">2</text>
    <text x="132" y="355">0</text><text x="132" y="255">1</text><text x="132" y="155">2</text>
    <text x="522" y="355">0</text><text x="522" y="255">1</text><text x="522" y="155">2</text>
    <text x="387" y="355">x</text><text x="777" y="355">x</text>
    <text x="140" y="126">r</text><text x="530" y="126">r</text>
  </g>

  <path d="M 155 300 H 370 M 545 300 H 760" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="260" y="320" font-family="sans-serif" font-size="13" fill="#6d28d9">threshold 0.5</text>
  <text x="650" y="320" font-family="sans-serif" font-size="13" fill="#6d28d9">threshold 0.5</text>
  <path d="M 155 350 L 355 150" fill="none" stroke="#c2410c" stroke-width="3.5"/>
  <path d="M 545 330 L 745 250" fill="none" stroke="#0f766e" stroke-width="3.5"/>

  <path d="M 355 250 V 150" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="5 4"/>
  <path d="M 545 350 V 330 M 645 250 V 290" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="5 4"/>
  <g fill="#1d4ed8" stroke="#ffffff" stroke-width="2">
    <circle cx="155" cy="350" r="8"/><circle cx="255" cy="250" r="8"/><circle cx="355" cy="250" r="8"/>
    <circle cx="545" cy="350" r="8"/><circle cx="645" cy="250" r="8"/><circle cx="745" cy="250" r="8"/>
  </g>
  <text x="245" y="399" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">C₂ at x = 0; C₁ at x = 1, 2</text>
  <text x="655" y="399" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">C₂ at x = 0; C₁ at x = 1, 2</text>
  <text x="450" y="448" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Blue dots: coded labels  ·  Red dashed segments: numerical residuals</text>
</svg>
