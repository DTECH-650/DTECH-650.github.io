<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" role="img" aria-labelledby="title description">
  <title id="title">Binary linear discriminant boundary</title>
  <desc id="description">The line x1 plus x2 equals 3 separates normal-demand and high-demand regions. Points at one-one and two-two lie on opposite sides, and the vector w is perpendicular to the line.</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="weight-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3412"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="560" fill="#ffffff"/>
  <text x="390" y="37" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">One score, two decision regions</text>

  <rect x="125" y="80" width="400" height="400" fill="#fff7ed"/>
  <path d="M 125 480 L 425 480 L 125 180 Z" fill="#eff6ff"/>
  <g stroke="#cbd5e1" stroke-width="1" opacity="0.8">
    <path d="M 225 80 V 480 M 325 80 V 480 M 425 80 V 480 M 525 80 V 480"/>
    <path d="M 125 380 H 525 M 125 280 H 525 M 125 180 H 525 M 125 80 H 525"/>
  </g>

  <path d="M 125 480 H 548 M 125 480 V 58" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <g font-family="sans-serif" font-size="16" fill="#475569">
    <text x="121" y="507">0</text>
    <text x="220" y="507">1</text>
    <text x="320" y="507">2</text>
    <text x="420" y="507">3</text>
    <text x="520" y="507">4</text>
    <text x="96" y="486">0</text>
    <text x="96" y="386">1</text>
    <text x="96" y="286">2</text>
    <text x="96" y="186">3</text>
    <text x="96" y="86">4</text>
  </g>
  <text x="555" y="489" font-family="sans-serif" font-size="18" font-weight="600" fill="#334155">x₁</text>
  <text x="110" y="59" font-family="sans-serif" font-size="18" font-weight="600" fill="#334155">x₂</text>

  <path d="M 125 180 L 425 480" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <text x="427" y="444" font-family="sans-serif" font-size="17" font-weight="600" fill="#6d28d9">x₁ + x₂ = 3</text>

  <circle cx="225" cy="380" r="9" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
  <text x="140" y="369" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e40af">(1, 1): normal</text>
  <circle cx="325" cy="280" r="9" fill="#c2410c" stroke="#ffffff" stroke-width="2"/>
  <text x="341" y="273" font-family="sans-serif" font-size="16" font-weight="600" fill="#9a3412">(2, 2): high</text>
  <circle cx="325" cy="380" r="8" fill="#ffffff" stroke="#6d28d9" stroke-width="3"/>
  <text x="338" y="406" font-family="sans-serif" font-size="15" fill="#5b21b6">(2, 1): on boundary</text>

  <path d="M 275 330 L 340 265" fill="none" stroke="#9a3412" stroke-width="3.5" marker-end="url(#weight-arrow)"/>
  <text x="281" y="253" font-family="sans-serif" font-size="18" font-weight="700" fill="#9a3412">w = (1, 1)</text>
  <text x="544" y="164" font-family="sans-serif" font-size="16" font-weight="600" fill="#9a3412">a(x) &gt; 0</text>
  <text x="544" y="190" font-family="sans-serif" font-size="15" fill="#9a3412">high demand</text>
  <text x="544" y="370" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e40af">a(x) &lt; 0</text>
  <text x="544" y="396" font-family="sans-serif" font-size="15" fill="#1e40af">normal demand</text>
</svg>
