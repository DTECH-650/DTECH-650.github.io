<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title description">
  <title id="title">Fisher projection from two-dimensional data onto a number line</title>
  <desc id="description">Blue class C1 and orange class C2 points in a two-dimensional feature space are projected onto a slanted direction w. The resulting one-dimensional number line shows blue and orange projected values, their means m1 and m2, and their within-class spreads. Fisher's criterion rewards a large squared distance between projected means relative to the sum of within-class squared deviations.</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#334155"/>
    </marker>
    <marker id="w-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0f766e"/>
    </marker>
    <marker id="gap-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="550" y="43" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#0f172a">Fisher's idea: find a useful one-dimensional view</text>
  <text x="550" y="72" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">Project the same labeled points, then compare the class centers and their spread.</text>

  <!-- Original feature space -->
  <rect x="58" y="92" width="530" height="340" rx="17" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="323" y="122" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#0f172a">Original feature space</text>
  <path d="M 90 390 H 563 M 90 390 V 143" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <text x="567" y="398" font-family="sans-serif" font-size="18" font-weight="600" fill="#334155">x₁</text>
  <text x="73" y="143" font-family="sans-serif" font-size="18" font-weight="600" fill="#334155">x₂</text>

  <ellipse cx="237" cy="270" rx="81" ry="64" transform="rotate(-24 237 270)" fill="#dbeafe" opacity="0.82"/>
  <ellipse cx="413" cy="210" rx="73" ry="56" transform="rotate(-24 413 210)" fill="#ffedd5" opacity="0.90"/>

  <!-- The green line is a projection axis, not a decision boundary. -->
  <path d="M 130 350 L 530 120" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#w-arrow)"/>
  <text x="535" y="118" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f766e">w</text>
  <text x="123" y="375" font-family="sans-serif" font-size="14" fill="#0f766e">projection axis</text>

  <!-- Representative perpendicular projections onto the w axis. -->
  <g fill="none" stroke-width="1.8" stroke-dasharray="5 5" opacity="0.85">
    <path d="M 220 235 L 247 283 M 260 220 L 284 261" stroke="#2563eb"/>
    <path d="M 385 245 L 367 214 M 405 235 L 386 203" stroke="#ea580c"/>
  </g>
  <g fill="#ffffff" stroke-width="2">
    <circle cx="247" cy="283" r="4.5" stroke="#2563eb"/>
    <circle cx="284" cy="261" r="4.5" stroke="#2563eb"/>
    <circle cx="367" cy="214" r="4.5" stroke="#ea580c"/>
    <circle cx="386" cy="203" r="4.5" stroke="#ea580c"/>
  </g>

  <g fill="#2563eb" stroke="#ffffff" stroke-width="2.5">
    <circle cx="205" cy="330" r="9"/>
    <circle cx="220" cy="235" r="9"/>
    <circle cx="260" cy="220" r="9"/>
    <circle cx="270" cy="280" r="9"/>
  </g>
  <g fill="#ea580c" stroke="#ffffff" stroke-width="2.5">
    <circle cx="385" cy="245" r="9"/>
    <circle cx="405" cy="235" r="9"/>
    <circle cx="420" cy="195" r="9"/>
    <circle cx="445" cy="170" r="9"/>
  </g>
  <circle cx="120" cy="163" r="7" fill="#2563eb"/>
  <text x="135" y="168" font-family="sans-serif" font-size="15" font-weight="600" fill="#1d4ed8">Class C₁</text>
  <circle cx="120" cy="189" r="7" fill="#ea580c"/>
  <text x="135" y="194" font-family="sans-serif" font-size="15" font-weight="600" fill="#c2410c">Class C₂</text>
  <text x="111" y="415" font-family="sans-serif" font-size="14" fill="#64748b">Dashed segments show projection onto w.</text>

  <!-- Notation card -->
  <rect x="615" y="92" width="427" height="340" rx="17" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="641" y="126" font-family="sans-serif" font-size="19" font-weight="700" fill="#0f172a">What Fisher measures</text>
  <path d="M 641 139 H 1016" stroke="#cbd5e1"/>
  <text x="641" y="174" font-family="sans-serif" font-size="17" fill="#334155">Projection</text>
  <text x="839" y="174" font-family="sans-serif" font-size="19" font-weight="600" fill="#0f766e">zₙ = wᵀxₙ</text>
  <text x="641" y="218" font-family="sans-serif" font-size="17" fill="#334155">Class means</text>
  <text x="839" y="218" font-family="sans-serif" font-size="19" font-weight="600" fill="#0f172a">m₁, m₂</text>
  <text x="641" y="262" font-family="sans-serif" font-size="17" fill="#334155">Within-class scatter</text>
  <text x="839" y="262" font-family="sans-serif" font-size="19" font-weight="600" fill="#0f172a">S₁ + S₂</text>
  <path d="M 641 282 H 1016" stroke="#cbd5e1"/>
  <text x="641" y="322" font-family="sans-serif" font-size="21" font-weight="700" fill="#0f172a">J<tspan baseline-shift="sub" font-size="14">F</tspan>(w) =</text>
  <text x="817" y="309" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#0f172a">(m₁ − m₂)²</text>
  <path d="M 729 317 H 906" stroke="#334155" stroke-width="1.7"/>
  <text x="817" y="343" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#0f172a">S₁ + S₂</text>
  <text x="641" y="389" font-family="sans-serif" font-size="16" fill="#475569">Prefer far-apart centers and tight groups.</text>

  <!-- Projected number line -->
  <text x="550" y="470" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a">After projection: each point has a coordinate zₙ</text>
  <text x="541" y="506" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#475569">mean gap |m₂ − m₁|</text>
  <path d="M 396 520 H 686" fill="none" stroke="#475569" stroke-width="1.7" marker-start="url(#gap-arrow)" marker-end="url(#gap-arrow)"/>
  <text x="386" y="552" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">m₁</text>
  <text x="696" y="552" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#c2410c">m₂</text>
  <rect x="259" y="563" width="225" height="65" rx="15" fill="#dbeafe" opacity="0.76"/>
  <rect x="601" y="563" width="200" height="65" rx="15" fill="#ffedd5" opacity="0.83"/>
  <path d="M 150 595 H 960" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#axis-arrow)"/>
  <text x="967" y="601" font-family="sans-serif" font-size="19" font-weight="600" fill="#334155">z</text>
  <path d="M 386 556 V 635 M 696 556 V 635" stroke="#475569" stroke-width="1.7" stroke-dasharray="5 5"/>

  <g fill="#2563eb" stroke="#ffffff" stroke-width="2.2">
    <circle cx="280" cy="595" r="9"/>
    <circle cx="385" cy="595" r="9"/>
    <circle cx="421" cy="595" r="9"/>
    <circle cx="458" cy="595" r="9"/>
  </g>
  <g fill="#ea580c" stroke="#ffffff" stroke-width="2.2">
    <circle cx="624" cy="595" r="9"/>
    <circle cx="663" cy="595" r="9"/>
    <circle cx="719" cy="595" r="9"/>
    <circle cx="779" cy="595" r="9"/>
  </g>

  <text x="372" y="662" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1d4ed8">C₁ deviations about m₁</text>
  <text x="708" y="662" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#c2410c">C₂ deviations about m₂</text>
  <text x="550" y="703" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">The shaded ranges illustrate spread; S₁ and S₂ are sums of squared deviations, not interval widths.</text>
  <text x="550" y="732" text-anchor="middle" font-family="sans-serif" font-size="16" font-style="italic" fill="#475569">A projection is not yet a classifier: a decision threshold on z would still be needed.</text>
</svg>
